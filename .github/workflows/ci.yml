name: AxonOS CI (Canonical Verification Pipeline)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# -----------------------------
# 1. MATRIX: tests across toolchains / features / OS
# -----------------------------
jobs:
  test-matrix:
    name: Test Matrix (${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta, nightly]
        features: ["", "json"]
    
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Run tests
        run: cargo test --no-fail-fast --features "${{ matrix.features }}"

# -----------------------------
# 2. CROSS TARGET BUILD MATRIX
# -----------------------------
  build-targets:
    name: Cross Build (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - wasm32-unknown-unknown
          - thumbv7em-none-eabihf

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --target ${{ matrix.target }} --no-default-features

# -----------------------------
# 3. STATIC ANALYSIS
# -----------------------------
  clippy:
    name: Clippy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

# -----------------------------
# 4. FORMAT
# -----------------------------
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

# -----------------------------
# 5. DOCS
# -----------------------------
  docs
