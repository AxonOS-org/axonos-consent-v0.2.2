name: AxonOS CI (Canonical Verification Pipeline)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# -----------------------------
# 1. MATRIX: tests across toolchains / features / OS
# -----------------------------
jobs:
  test-matrix:
    name: Test Matrix (${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta, nightly]
        features: ["", "json"]
    
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Run tests
        run: cargo test --no-fail-fast --features "${{ matrix.features }}"

# -----------------------------
# 2. CROSS TARGET BUILD MATRIX
# -----------------------------
  build-targets:
    name: Cross Build (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - wasm32-unknown-unknown
          - thumbv7em-none-eabihf

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --target ${{ matrix.target }} --no-default-features

# -----------------------------
# 3. STATIC ANALYSIS
# -----------------------------
  clippy:
    name: Clippy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

# -----------------------------
# 4. FORMAT
# -----------------------------
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

# -----------------------------
# 5. DOCS
# -----------------------------
  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features

# -----------------------------
# 6. SECURITY
# -----------------------------
  audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - run: cargo audit

  deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny
      - run: cargo deny check

# -----------------------------
# 7. UNSAFE / CODE HEALTH
# -----------------------------
  geiger:
    name: Unsafe Usage Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-geiger
      - run: cargo geiger

  udeps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-udeps
      - run: cargo +nightly udeps

# -----------------------------
# 8. MEMORY SAFETY
# -----------------------------
  miri:
    name: Miri (UB detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test

# -----------------------------
# 9. FUZZ (lightweight smoke)
# -----------------------------
  fuzz-check:
    name: Fuzz Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-fuzz
      - run: cargo fuzz build || true

# -----------------------------
# 10. BENCH
# -----------------------------
  bench:
    name: Benchmark Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo bench --no-run

# -----------------------------
# 11. CRYPTO VECTOR INTEGRITY
# -----------------------------
  vectors:
    name: Vector Integrity (SHA-256)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          EXPECTED="29a8bf9f2b4dabe5d9641a8a4c416f361c2ba9815cca9b8e9e1d222d002fa50a"
          ACTUAL=$(sha256sum tests/vectors/consent-interop-vectors-v0.1.0.json | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Integrity violation!"
            exit 1
          fi

# -----------------------------
# 12. RELEASE BUILD
# -----------------------------
  release:
    name: Release Build (optimized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
