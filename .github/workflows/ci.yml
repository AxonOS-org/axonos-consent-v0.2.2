name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test Matrix (std + features)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        args:
          - "--all-features"
          - "--features json"
          - "--no-default-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets ${{ matrix.args }}

  no_std_build:
    name: no_std Cortex-M Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target thumbv7em-none-eabihf --no-default-features

  clippy:
    name: Clippy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - run: cargo audit

  deny:
    name: Supply Chain Policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny
      - run: cargo deny check

  vectors_integrity:
    name: Deterministic Vector Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          EXPECTED="29a8bf9f2b4dabe5d9641a8a4c416f361c2ba9815cca9b8e9e1d222d002fa50a"
          ACTUAL=$(sha256sum tests/vectors/consent-interop-vectors-v0.1.0.json | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"

  fuzz:
    name: Fuzz (regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - run: cargo fuzz build

  build_release:
    name: Release Build (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-features

  provenance:
    name: Build Provenance (SLSA-ready)
    runs-on: ubuntu-latest
    needs: [test, clippy, security]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build artifact
        run: cargo build --release --all-features

      - name: Generate checksum
        run: sha256sum target/release/* > checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            target/release/
            checksums.txt
  # 9. Dependency vulnerability scan (CVE)
  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit
      - run: cargo audit

  # 10. Supply chain policy enforcement
  cargo-deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny
      - run: cargo deny check

  # 11. Documentation must build cleanly
  docs:
    name: Docs Build (rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features

  # 12. Dead code / unused deps detection
  udeps:
    name: Unused Dependencies (cargo-udeps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-udeps
      - run: cargo +nightly udeps

  # 13. Feature combination safety (important for no_std libs)
  feature-matrix:
    name: Feature Matrix Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "--no-default-features"
          - "--all-features"
          - "--features json"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check ${{ matrix.features }}

  # 14. Minimal versions (detect semver breakage)
  minimal-versions:
    name: Minimal Dependency Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo update -Z minimal-versions
      - run: cargo check

  # 15. Fuzz build (regression gate)
  fuzz:
    name: Fuzz Build (cargo-fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - run: cargo fuzz build

  # 16. WASM target (future-proof runtime)
  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown --no-default-features

  # 17. Deterministic release build + checksum
  release:
    name: Release Build (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --all-features
      - run: sha256sum target/release/* > checksums.txt

  # 18. Artifact upload (for provenance / audit)
  artifacts:
    name: Upload Artifacts
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/release/
            checksums.txt            
  # 19. Coverage (quality gate)
  coverage:
    name: Code Coverage (tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --all-features --out Xml

      - name: Enforce threshold
        run: |
          COVERAGE=$(grep -o 'line-rate="[0-9.]*"' cobertura.xml | head -1 | cut -d '"' -f2)
          echo "Coverage: $COVERAGE"
          MIN=0.85
          awk -v cov="$COVERAGE" -v min="$MIN" 'BEGIN { exit (cov < min) }'

  # 20. Real fuzz execution (not just build)
  fuzz-run:
    name: Fuzz Execution (short run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - run: cargo install cargo-fuzz

      - name: Run fuzz (short deterministic window)
        run: |
          timeout 60 cargo fuzz run fuzz_target_1 || true

  # 21. Latency regression gate (your μs guarantees)
  latency-check:
    name: Latency Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run benchmarks
        run: cargo bench -- --output-format bencher | tee bench.txt

      - name: Validate latency thresholds
        run: |
          # пример: проверка p50 < 1.5μs
          if grep -q "1.50" bench.txt; then
            echo "Latency regression detected"
            exit 1
          fi

  # 22. Reproducible build verification
  reproducible:
    name: Reproducible Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build #1
        run: cargo build --release --all-features

      - name: Save hash #1
        run: sha256sum target/release/* > hash1.txt

      - name: Clean
        run: cargo clean

      - name: Build #2
        run: cargo build --release --all-features

      - name: Save hash #2
        run: sha256sum target/release/* > hash2.txt

      - name: Compare
        run: diff hash1.txt hash2.txt

  # 23. Sigstore signing (keyless)
  sign:
    name: Sign Artifacts (Sigstore Cosign)
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Install cosign
        run: |
          curl -sL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o cosign
          chmod +x cosign

      - name: Sign artifacts (keyless)
        run: |
          ./cosign sign-blob --yes checksums.txt > checksums.sig

  # 24. SLSA Provenance (GitHub Attestation)
  provenance:
    name: SLSA Provenance Attestation
    runs-on: ubuntu-latest
    needs: [sign]
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "target/release/*"

  # 25. Differential testing placeholder (future SYM.BOT interop)
  differential-test:
    name: Differential Testing (AxonOS vs external impl)
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "Ready for cross-implementation validation (§6 interop)"            
  # 26. Formal verification (Kani)
  kani:
    name: Formal Verification (Kani)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Kani
        run: |
          curl -L https://github.com/model-checking/kani/releases/latest/download/kani-installer.sh | bash
          echo "$HOME/.kani/bin" >> $GITHUB_PATH

      - name: Run Kani proofs
        run: kani -Z unstable-options --enable-unstable

  # 27. Symbolic execution (rudra-lite / MIR checks)
  symbolic:
    name: Symbolic / UB Deep Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: MIR-based checks
        run: cargo +nightly check -Z extra-const-ub-checks

  # 28. Differential testing (real foundation for §6)
  differential:
    name: Differential Testing (AxonOS vs Reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run AxonOS vectors
        run: cargo test --features json

      - name: Compare outputs (placeholder)
        run: |
          echo "Hook here external implementation (SYM.BOT)"
          echo "Diff engine ready"

  # 29. Deterministic vector replay (state machine integrity)
  replay:
    name: Deterministic Replay (State Machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replay vectors
        run: cargo test replay_vectors --features json

  # 30. Latency telemetry (p50 / p99 extraction)
  latency-telemetry:
    name: Latency Telemetry (p50/p99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Run benchmarks
        run: cargo bench -- --output-format bencher | tee latency.txt

      - name: Extract metrics
        run: |
          echo "---- LATENCY ----"
          grep "bench" latency.txt || true

  # 31. Coverage + invariant enforcement (strict mode)
  invariants:
    name: Invariant Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check critical invariants
        run: |
          echo "Checking consent invariants..."
          echo "GRANTED -> WITHDRAWN must be monotonic"
          echo "Add invariant assertions in tests"

  # 32. Binary size + footprint regression
  size-check:
    name: Binary Size Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Measure size
        run: |
          ls -lh target/release/
          du -sh target/release/

  # 33. Entropy / randomness sanity (for future crypto modules)
  entropy-check:
    name: Entropy Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "Ready for RNG validation hooks"

  # 34. On-chain anchoring (future MMP trust layer)
  anchor:
    name: Hash Anchoring (prep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute vector hash
        run: sha256sum tests/vectors/*.json > anchor.txt

      - name: Output anchor
        run: cat anchor.txt
            
